<style>
/* Layout: one thumb-driven column. A plum "week" panel on top, plain lists below, bottom tabs and one add button. */
:root{
  --bg:#F7F3FA;--surface:#FFFFFF;--line:#E4DAEC;--ink:#24133A;--muted:#6B5C7B;
  --plum:#2C1747;--on-plum:#FFFFFF;--on-plum-soft:#CDBFDD;
  --accent:#A3155F;--on-accent:#FFFFFF;--accent-soft:#F9E3EF;
  --in:#0B7A63;--in-soft:#DDF3EC;--out:#C2185B;--due:#B86E00;--due-soft:#FCEFD6;
  --bar-in:#2FC6A3;--bar-out:#F0468D;--bar-due:#FFB627;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#170D22;--surface:#221531;--line:#3A2A4C;--ink:#F4EEFA;--muted:#B2A3C2;
  --plum:#33204F;--on-plum:#FFFFFF;--on-plum-soft:#CDBFDD;
  --accent:#F36BAE;--on-accent:#2C0A1C;--accent-soft:#44193A;
  --in:#5CDDBF;--in-soft:#123B34;--out:#F983B5;--due:#FFC45C;--due-soft:#43300E;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#170D22;--surface:#221531;--line:#3A2A4C;--ink:#F4EEFA;--muted:#B2A3C2;
  --plum:#33204F;--on-plum:#FFFFFF;--on-plum-soft:#CDBFDD;
  --accent:#F36BAE;--on-accent:#2C0A1C;--accent-soft:#44193A;
  --in:#5CDDBF;--in-soft:#123B34;--out:#F983B5;--due:#FFC45C;--due-soft:#43300E;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:1.25rem;font-weight:700}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#main{max-width:680px;margin:0 auto;padding-block:12px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
#main>*{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:1.65rem;font-weight:800}
.note{background:var(--due-soft);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:.875rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero{background:var(--plum);color:var(--on-plum);border-radius:22px;padding:16px 18px 18px;display:grid;gap:12px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav button{background:none;border:0;color:var(--on-plum);width:44px;height:44px;font-size:1.5rem;border-radius:50%;cursor:pointer}
.weeknav b{font-weight:600}
.big{font:800 clamp(2.8rem,14vw,4.2rem)/1 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.bigl{color:var(--on-plum-soft);font-size:.95rem}
.ribbon{display:flex;height:16px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.14);gap:2px}
.ribbon i{display:block;min-width:0}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.legend div{min-width:0}
.legend span{display:flex;align-items:center;gap:6px;color:var(--on-plum-soft);font-size:.8rem}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--dot)}
.legend b{font:700 1.05rem var(--display);overflow-wrap:anywhere}
.warn{background:var(--bar-due);color:#2B1A00;padding:9px 11px;border-radius:10px;font-weight:600;font-size:.9rem}
.sect{display:grid;gap:10px}
.secth{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 13px;min-height:58px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.list>*+*{border-top:1px solid var(--line)}
.row .m{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.amt{font:700 1.05rem var(--display);white-space:nowrap}
.amt.in{color:var(--in)}
.day{padding:7px 13px;background:var(--bg);color:var(--muted);font-size:.84rem;font-weight:600}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.76rem;font-weight:600;background:var(--due-soft);color:var(--due)}
.chip.late{background:var(--accent-soft);color:var(--out)}
.chip.ok{background:var(--in-soft);color:var(--in)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:44px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.s{min-height:38px;padding:5px 11px;font-size:.9rem}
.btn.d{color:var(--out)}
.btn:disabled{opacity:.55}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--line);border-radius:11px;padding:3px;gap:3px}
.seg label,.seg button{flex:1;text-align:center;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;cursor:pointer;min-height:40px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked),.seg button.on{background:var(--surface)}
.seg label:has(input:focus-visible){outline:3px solid var(--accent)}
.seg.vista button{padding:7px 3px;font-size:.92rem}
.seg.dark{background:rgba(255,255,255,.14)}.seg.dark button{color:var(--on-plum);min-height:36px;padding:5px}.seg.dark button.on{background:var(--on-plum);color:#2C1747}
.weeknav.plain button{width:auto;height:auto;color:inherit}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;color:var(--muted);font-size:.78rem;font-weight:600;text-transform:capitalize}
.dia{aspect-ratio:1/1.05;max-width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.dia b{font-weight:600;font-size:.88rem}.dia.hoy{border:2px solid var(--accent)}
.dots{display:flex;gap:2px;min-height:7px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--due)}.dots i.late{background:var(--out)}.dots i.ok{background:var(--in)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stats div{background:var(--surface);padding:11px 13px;min-width:0}
.stats span{display:block;color:var(--muted);font-size:.84rem}
.stats b{font:700 1.3rem var(--display);overflow-wrap:anywhere}
.chart{display:flex;align-items:flex-end;gap:7px;height:136px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.wk{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;background:none;border:0;padding:0;cursor:pointer}
.wk .bars{flex:1;display:flex;align-items:flex-end;gap:2px;min-height:0}
.wk .bars i{flex:1;border-radius:3px 3px 0 0;min-height:1px}
.wk small{font-size:.68rem;color:var(--muted);text-align:center;white-space:nowrap}
.wk.on small{color:var(--ink);font-weight:700}
.key{display:flex;gap:14px;color:var(--muted);font-size:.84rem}
.key span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:3px;background:var(--dot)}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--accent);max-width:100%}
.meter i.over{background:var(--due)}
.empty{padding:20px 14px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px;display:grid;gap:10px;justify-items:center}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#tabs div{display:flex;width:100%;max-width:680px}
#tabs button{flex:1;min-width:0;border:0;background:none;height:58px;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="page"]{color:var(--accent)}
#add{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font:500 2rem/1 var(--body);cursor:pointer;box-shadow:0 6px 18px rgba(36,19,58,.35)}
#scrim{position:fixed;inset:0;z-index:20;background:rgba(20,8,32,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-block:16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:13px}
#sheet form{display:grid;gap:13px}
#sheet form>*{min-width:0}
.sheeth{display:flex;align-items:center;justify-content:space-between;gap:8px}
.x{background:none;border:0;width:44px;height:44px;font-size:1.5rem;color:var(--muted);cursor:pointer}
.f{display:grid;gap:4px;min-width:0}
.f>span{font-size:.875rem;font-weight:600;color:var(--muted)}
.f small{color:var(--muted)}
input:not([type=radio]):not([type=checkbox]),select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:46px;padding:9px 11px;font-size:16px}
input.money{font:800 2.1rem var(--display);text-align:center;min-height:68px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:9px;min-height:40px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.err{color:var(--out);font-weight:600;font-size:.92rem}
#toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(142px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:999px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.auth{max-width:420px;margin:0 auto;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.auth form{display:grid;gap:12px}
.auth h1{font-size:2.4rem;font-weight:800}
.code{font:800 1.5rem var(--display);letter-spacing:.06em;user-select:all;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){#sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px)}}}
</style>

<script>

const sum=(a,f)=>a.reduce((n,x)=>n+f(x),0);
const usd=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"});

const $m=c=>usd.format((c||0)/100), $r=c=>Math.abs(c)%100?$m(c):usd0.format((c||0)/100);
function toCents(v){ if(typeof v==="number")return Math.round(v*100);
  let s=String(v??"").trim().replace(/[$\s]/g,""); let neg=/^\(.*\)$/.test(s)||s.startsWith("-"); s=s.replace(/[()\-+]/g,"").replace(/,/g,"");
  if(s===""||isNaN(+s))return NaN; const c=Math.round(+s*100); return neg?-c:c }
const centsStr=c=>c?(c/100).toFixed(2):"";
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
function addMonths(s,n,anchor){const[y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(anchor||d,last));return iso(t)}
const weekStart=(s,start)=>{const d=parseD(s);return addDays(s,-((d.getDay()-start+7)%7))};
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIA=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const fDate=s=>{const d=parseD(s);return`${d.getDate()} ${MES[d.getMonth()]}`};
const fRange=(a,b)=>{const x=parseD(a),y=parseD(b);return x.getMonth()===y.getMonth()?`${x.getDate()} al ${y.getDate()} de ${MESL[y.getMonth()]}`:`${x.getDate()} ${MES[x.getMonth()]} al ${y.getDate()} ${MES[y.getMonth()]}`};
const fDay=s=>{const d=parseD(s),t=today();return s===t?"Hoy":s===addDays(t,-1)?"Ayer":`${DIA[d.getDay()]} ${d.getDate()} de ${MESL[d.getMonth()]}`};

/* ---------- money logic (pure) ---------- */
const FREC={semanal:"Cada semana",dos:"Cada 2 semanas",mensual:"Cada mes",unica:"Una sola vez"};
function nextDate(r,from){from=from||r.proxima;
  if(r.frecuencia==="semanal")return addDays(from,7); if(r.frecuencia==="dos")return addDays(from,14);
  if(r.frecuencia==="mensual")return addMonths(from,1,r.dia||+r.proxima.slice(8)); return null}
function ocurrencias(r,hasta,desde="0000-00-00"){if(r.hecho)return[];const o=[];let d=r.proxima,g=0;
  while(d&&d<=hasta&&g++<120){if(d>=desde)o.push(d);d=nextDate(r,d)}return o}
const semanalDe=r=>r.frecuencia==="semanal"?r.monto:r.frecuencia==="dos"?r.monto/2:r.frecuencia==="mensual"?r.monto*12/52:0;
function saldoDeuda(d,movs){return d.saldoInicial+(d.ajuste||0)-sum(movs.filter(m=>m.deudaId===d.id),m=>m.monto)}
function saldoPersona(pid,tratos,movs){
  return sum(tratos.filter(t=>t.personaId===pid),t=>t.dir==="debo"?t.monto:-t.monto)
    +sum(movs.filter(m=>m.personaId===pid&&m.aplicaSaldo),m=>m.tipo==="gasto"?-m.monto:m.monto)}
/* Pays every debt month by month. orden: "avalancha" = highest rate first, "bola" = smallest balance first. */
function simular(deudas,extra,orden){
  let ds=deudas.filter(d=>d.saldo>0).map(d=>({...d})),meses=0,interes=0;
  if(!ds.length)return{meses:0,interes:0,primero:null,ok:true};
  const rank=orden==="bola"?(a,b)=>a.saldo-b.saldo||b.apr-a.apr:(a,b)=>b.apr-a.apr||a.saldo-b.saldo;
  const primero=[...ds].sort(rank)[0];
  while(ds.length&&meses<600){meses++;let bolsa=extra;
    for(const d of ds){const i=d.saldo*(d.apr||0)/1200;interes+=i;d.saldo+=i}
    for(const d of ds){const p=Math.min(d.minimo||0,d.saldo);d.saldo-=p;bolsa+=(d.minimo||0)-p}
    for(const d of [...ds].sort(rank)){if(bolsa<=0)break;const p=Math.min(bolsa,d.saldo);d.saldo-=p;bolsa-=p}
    for(const d of ds)if(d.saldo<.5){bolsa=0;d.fin=true}
    const quedan=ds.filter(d=>!d.fin);ds.filter(d=>d.fin).forEach(d=>{extra+=d.minimo||0});ds=quedan}
  return{meses,interes:Math.round(interes),primero,ok:ds.length===0}}

    if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=h}
    else if(h==='"')q=true; else if(h===","){r.push(c);c=""}
    else if(h==="\n"||h==="\r"){if(h==="\r"&&t[i+1]==="\n")i++;r.push(c);c="";if(r.some(x=>x.trim()))R.push(r);r=[]}
    else c+=h}
  r.push(c);if(r.some(x=>x.trim()))R.push(r);return R}
function parseFecha(s){s=String(s||"").trim().split(/\s/)[0];let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))return`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/)){const y=m[3].length===2?"20"+m[3]:m[3];if(+m[1]>12)return null;return`${y}-${pad(+m[1])}-${pad(+m[2])}`}
  return null}
function columnasCSV(h){const f=res=>h.findIndex(x=>res.test(String(x).toLowerCase().trim()));
  return{fecha:(()=>{const a=f(/^(posting |transaction |trans\.? )?date$|fecha/);return a>=0?a:f(/date/)})(),
    concepto:f(/desc|concepto|detalle|memo|payee|merchant|name/),monto:f(/^amount|monto|importe/),
    cargo:f(/debit|cargo|withdraw/),abono:f(/credit|abono|deposit/)}}
const CLAVES=[[/walmart|publix|winn|aldi|target|kroger|food|market|costco/i,"Comida"],[/shell|exxon|chevron|bp |wawa|gas/i,"Gasolina"],[/netflix|spotify|apple\.com|hulu|disney|adobe|canva/i,"Suscripciones"],[/jea|att|at&t|comcast|xfinity|verizon|t-mobile|tmobile/i,"Servicios"],[/rent|renta|mortgage/i,"Casa"],[/cvs|walgreens|pharm|doctor|clinic/i,"Salud"]];
function adivinaCat(concepto,tipo,movs,cfg){const prev=movs.find(m=>m.tipo===tipo&&m.concepto.toLowerCase()===concepto.toLowerCase());if(prev)return prev.categoria;
  if(tipo==="ingreso")return cfg.catIngreso[cfg.catIngreso.length-1];
  const k=CLAVES.find(([r])=>r.test(concepto));return k&&cfg.catGasto.includes(k[1])?k[1]:"Otro"}
function leerFilasCSV(rows,cols,invertir,movs,cfg){const dup=new Set(movs.map(m=>`${m.fecha}|${m.tipo==="gasto"?-m.monto:m.monto}|${m.concepto.toLowerCase()}`));
  const nuevos=[];let repetidos=0,malos=0;
  for(const r of rows){const fecha=parseFecha(r[cols.fecha]),concepto=String(r[cols.concepto]||"").trim();let c;
    if(cols.monto>=0)c=toCents(r[cols.monto]);else{const a=toCents(r[cols.abono]),g=toCents(r[cols.cargo]);c=(a||0)-(Math.abs(g)||0)}
    if(!fecha||!concepto||!c){malos++;continue}
    if(invertir)c=-c;
    if(dup.has(`${fecha}|${c}|${concepto.toLowerCase()}`)){repetidos++;continue}
    const tipo=c<0?"gasto":"ingreso";nuevos.push({fecha,concepto,tipo,monto:Math.abs(c),categoria:adivinaCat(concepto,tipo,movs,cfg)})}
  return{nuevos,repetidos,malos}}

  ${A.length?`<div class="list">${A.map(m=>`<button type="button" class="row" data-a="editMov" data-v="${m.id}"><span class="m"><span class="t">Abono</span><br><span class="s">${fDate(m.fecha)} · ${QUIEN[m.quien]||""}</span></span><span class="amt">${$m(m.monto)}</span></button>`).join("")}</div>`:""}`)}
function formAbono(id){const d=Store.items[id];sheet(`Abonar a ${d.nombre}`,`${montoIn(d.minimo)}${field("Fecha",`<input id="ab-f" type="date" name="fecha" value="${today()}">`)}${segQ(d.quien)}`,{ok:"Registrar abono",onOk:f=>{const c=toCents(f.monto);if(!(c>0))return"Escribe un monto mayor que cero.";Store.put({fecha:f.fecha||today(),tipo:"gasto",monto:c,concepto:`Abono ${d.nombre}`,categoria:"Deuda",quien:f.quien,deudaId:id},"mov");toast("Abono registrado")}})}
function formCorregir(id){const d=Store.items[id],s=saldoDeuda(d,Store.list("mov"));sheet(`Corregir saldo de ${d.nombre}`,`${montoIn(s).replace("Monto","Saldo del estado de cuenta")}<p class="s">Cambia el saldo sin crear un gasto. Sirve para sumar intereses o cargos nuevos.</p>`,{ok:"Corregir saldo",onOk:f=>{const c=toCents(f.monto);if(isNaN(c)||c<0)return"Escribe un saldo válido.";Store.put({...d,ajuste:(d.ajuste||0)+c-s},"deuda");toast("Saldo corregido")}})}

/* ---------- Más ---------- */
function vMas(){if(V.sub)return{reportes:vReportes,metas:vMetas,ajustes:vAjustes}[V.sub]();
  const it=[["reportes","Reportes","En qué se va el dinero cada mes"],["metas","Metas de ahorro","Lo que están guardando y para qué"],["importar","Importar estado de cuenta","Sube un archivo CSV de tu banco"],["ajustes","Ajustes","Categorías, semana y otro teléfono"]];
  return`<div class="top"><h1>Más</h1></div><div class="list">${it.map(([k,t,s])=>`<button class="row" data-a="${k==="importar"?"importar":"sub"}" data-v="${k}"><span class="m"><span class="t">${t}</span><br><span class="s">${s}</span></span><span aria-hidden="true">›</span></button>`).join("")}</div>`}
const back=t=>`<div class="top"><h1>${t}</h1><button class="btn s" data-a="sub" data-v="">Volver</button></div>`;
function vReportes(){const M=Store.list("mov").filter(m=>m.fecha.startsWith(V.mes)&&mq(m)),G=M.filter(m=>m.tipo==="gasto"),I=M.filter(m=>m.tipo==="ingreso"),cfg=Store.cfg;
  const grp=(L,k)=>{const o={};L.forEach(m=>o[m[k]]=(o[m[k]]||0)+m.monto);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
  const g=sum(G,m=>m.monto),i=sum(I,m=>m.monto),[y,mm]=V.mes.split("-").map(Number);
  const cats=grp(G,"categoria"),max=cats[0]?.[1]||1;
  const barra=([c,v])=>{const l=cfg.limites[c];return`<button class="row" data-a="limite" data-v="${esc(c)}"><span class="m"><span class="t">${esc(c)}</span><span class="meter" style="display:block"><i class="${l&&v>l?"over":""}" style="width:${(l?v/l:v/max)*100}%"></i></span><span class="s">${l?`${v>l?"Pasado por "+$r(v-l):"Quedan "+$r(l-v)} de ${$r(l)}`:"Sin límite"}</span></span><span class="amt">${$r(v)}</span></button>`};
  return`${back("Reportes")}${vistaBar()}
  <div class="weeknav"><button class="btn s" data-a="mes" data-v="-1" aria-label="Mes anterior">‹</button><b>${MESL[mm-1]} ${y}</b><button class="btn s" data-a="mes" data-v="1" aria-label="Mes siguiente">›</button></div>
  <div class="stats"><div><span>Entró</span><b>${$r(i)}</b></div><div><span>Salió</span><b>${$r(g)}</b></div><div><span>Quedó</span><b>${$r(i-g)}</b></div><div><span>Ahorro del ingreso</span><b>${i?Math.round((i-g)/i*100):0}%</b></div></div>
  ${M.length?`<section class="sect"><h2>Gastos por categoría</h2><div class="list">${cats.map(barra).join("")}</div></section>
  <section class="sect"><h2>De dónde entró</h2><div class="list">${grp(I,"categoria").map(([c,v])=>`<div class="row"><span class="m t">${esc(c)}</span><span class="amt in">${$r(v)}</span></div>`).join("")||`<div class="row"><span class="s">Sin ingresos este mes</span></div>`}</div></section>
  <section class="sect"${V.vista?" hidden":""}><h2>Separado</h2><div class="list">${Object.entries(QUIEN).map(([k,l])=>`<div class="row"><span class="m t">${l}</span><span class="s">Entró ${$r(sum(I.filter(m=>m.quien===k),m=>m.monto))}</span><span class="amt">${$r(sum(G.filter(m=>m.quien===k),m=>m.monto))}</span></div>`).join("")}</div></section>`:vacio("No hay movimientos en este mes.")}`}
const ahorrado=id=>sum(Store.list("mov").filter(m=>m.metaId===id),m=>m.tipo==="gasto"?m.monto:-m.monto);
function vMetas(){const L=Store.list("meta");return`${back("Metas de ahorro")}<button class="btn p" data-a="nuevaMeta">Agregar meta</button>
  ${L.length?`<div class="list">${L.map(g=>{const a=ahorrado(g.id);return`<button class="row" data-a="meta" data-v="${g.id}"><span class="m"><span class="t">${esc(g.nombre)}</span><span class="meter" style="display:block"><i style="width:${Math.min(a/g.objetivo*100,100)}%"></i></span><span class="s">${$r(a)} de ${$r(g.objetivo)}${g.fecha?` · para ${fDate(g.fecha)}`:""}</span></span><span class="amt">${Math.floor(a/g.objetivo*100)}%</span></button>`}).join("")}</div>`:vacio("Crea una meta y cada aporte quedará anotado.")}`}
function formMeta(g){const nuevo=!g;g=g||{};sheet(nuevo?"Agregar meta":"Editar meta",`${field("Nombre",`<input id="g-n" name="nombre" value="${esc(g.nombre)}" placeholder="Ej. Fondo de emergencia">`)}${montoIn(g.objetivo).replace("Monto","Cuánto quieren juntar")}${field("Para cuándo (opcional)",`<input id="g-f" type="date" name="fecha" value="${g.fecha||""}">`)}`,{ok:nuevo?"Agregar meta":"Guardar cambios",extra:nuevo?"":`<button type="button" class="btn d" data-a="delMeta" data-v="${g.id}">Eliminar meta</button>`,onOk:f=>{const c=toCents(f.monto);if(!f.nombre.trim())return"Escribe un nombre.";if(!(c>0))return"Escribe cuánto quieren juntar.";Store.put({...g,nombre:f.nombre.trim(),objetivo:c,fecha:f.fecha},"meta");toast("Guardado")}})}
function verMeta(id){const g=Store.items[id];sheet(g.nombre,`${montoIn()}${segQ("juntos")}<button type="button" class="btn" data-a="editMeta" data-v="${id}">Editar meta</button>`,{ok:"Agregar aporte",onOk:f=>{const c=toCents(f.monto);if(!(c>0))return"Escribe un monto mayor que cero.";Store.put({fecha:today(),tipo:"gasto",monto:c,concepto:`Aporte a ${g.nombre}`,categoria:"Ahorro",quien:f.quien,metaId:id},"mov");toast("Aporte agregado")}})}
function vAjustes(){const c=Store.cfg;return`${back("Ajustes")}
  ${Store.sb?`<section class="sect"><h2>Hogar</h2><div class="list"><div class="row"><span class="m"><span class="t">Conectar otro teléfono</span><br><span class="s">Envía este enlace solo a Gabriel. Quien lo abra podrá ver y cambiar todas sus finanzas.</span></span><button class="btn s" data-a="copiarLink">Copiar enlace</button></div></div></section>`:""}
  <section class="sect"><h2>La semana empieza el</h2><select id="a-sem" aria-label="Inicio de semana">${opts(DIA.map((d,i)=>[String(i),d]),String(c.inicioSemana))}</select></section>
  <section class="sect"><h2>Categorías</h2>${field("De gastos",`<textarea id="a-g" rows="3">${esc(c.catGasto.join(", "))}</textarea>`)}${field("De ingresos",`<textarea id="a-i" rows="2">${esc(c.catIngreso.join(", "))}</textarea>`,"Sepáralas con comas.")}<button class="btn" data-a="guardaCats">Guardar categorías</button></section>
  ${Store.sb?`<section class="sect"><h2>Respaldo</h2><div class="rowbtns"><button class="btn" data-a="exportCSV">Descargar movimientos</button><button class="btn" data-a="exportJSON">Descargar respaldo completo</button></div></section>`:""}`}
function saveCfg(p){Store.put({...Store.cfg,id:"config",...p},"config")}
function bajar(nombre,txt,tipo){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nombre;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
const celda=v=>`"${String(v??"").replace(/"/g,'""')}"`;

/* ---------- importar ---------- */
function formImport(){const s=sheet("Importar estado de cuenta",`<p>Descarga las transacciones de tu banco en formato CSV y súbelas aquí. Las que ya estén anotadas no se repiten.</p>
  ${field("Archivo CSV",`<input id="i-f" type="file" accept=".csv,text/csv">`)}${segQ("juntos")}
  <label class="check"><input type="checkbox" id="i-inv">Mis gastos vienen en positivo (común en tarjetas)</label><div id="i-p"></div>`);
  let rows=null,cols=null;const prev=()=>{if(!rows)return;const r=leerFilasCSV(rows,cols,$("#i-inv").checked,Store.list("mov"),Store.cfg);
    $("#i-p").innerHTML=`<div class="sect"><p><b>${r.nuevos.length}</b> movimientos nuevos${r.repetidos?`, ${r.repetidos} repetidos`:""}${r.malos?`, ${r.malos} sin leer`:""}.</p>
    <div class="tablewrap"><table><tr><th>Fecha</th><th>Concepto</th><th>Categoría</th><th>Monto</th></tr>${r.nuevos.slice(0,6).map(n=>`<tr><td>${fDate(n.fecha)}</td><td>${esc(n.concepto.slice(0,26))}</td><td>${esc(n.categoria)}</td><td>${n.tipo==="gasto"?"−":"+"}${$m(n.monto)}</td></tr>`).join("")}</table></div>
    ${r.nuevos.length?`<button type="button" class="btn p" id="i-go">Importar ${r.nuevos.length}</button>`:""}</div>`;
    const go=$("#i-go");if(go)go.onclick=()=>{const q=$("input[name=quien]:checked",s).value;r.nuevos.forEach(n=>Store.put({...n,quien:q},"mov"));closeSheet();render();toast(`${r.nuevos.length} movimientos importados`)}};
  $("#i-f").onchange=async e=>{const f=e.target.files[0];if(!f)return;const R=parseCSV(await f.text()),i=R.findIndex(x=>{const c=columnasCSV(x);return c.fecha>=0&&c.concepto>=0&&(c.monto>=0||c.cargo>=0||c.abono>=0)});
    if(i<0){$("#i-p").innerHTML=`<p class="err">No encontré columnas de fecha, descripción y monto en ese archivo.</p>`;rows=null;return}cols=columnasCSV(R[i]);rows=R.slice(i+1);prev()};
  $("#i-inv").onchange=prev}

/* ---------- actions ---------- */
const A={tab(v){V.tab=v;V.sub=null;window.scrollTo(0,0);render()},wk(v){V.ref=V.periodo==="mes"?addMonths(V.ref.slice(0,8)+"01",+v,1):addDays(V.ref,7*v);render()},irwk(v){V.ref=v;render()},periodo(v){V.periodo=v;lsSet("cc_periodo",v);render()},vista(v){V.vista=v;lsSet("cc_vista",v);render()},cal(v){V.cal=addMonths(V.cal+"-01",+v,1).slice(0,7);render()},dia(v){verDia(v)},recDia(v){formRec(null,{proxima:v})},nuevo(){formMov()},editMov(v){formMov(Store.items[v])},
  delMov(v){borrarMov(Store.items[v]);closeSheet();render();toast("Movimiento eliminado")},ftipo(v){V.filtro.tipo=v;render()},vpagos(v){V.pagos=v;render()},nuevoRec(){formRec()},editRec(v){formRec(Store.items[v])},
  delRec(v){Store.del(v);closeSheet();render();toast("Pago eliminado")},pagar(v){formPagar(Store.items[v])},nuevaPersona(){formPersona()},persona(v){verPersona(v)},editPersona(v){formPersona(Store.items[v])},
  delPersona(v){Store.list("trato").filter(t=>t.personaId===v).forEach(t=>Store.del(t.id));Store.del(v);closeSheet();render();toast("Persona eliminada")},pagarA(v){formPagarA(v)},trato(v){formTrato(v)},
  delTrato(v){const t=Store.items[v];pregunta("¿Eliminar esta anotación?","Eliminar",()=>{Store.del(v);toast("Anotación eliminada")});return t},
  nuevaDeuda(){formDeuda()},deuda(v){verDeuda(v)},editDeuda(v){formDeuda(Store.items[v])},abonar(v){formAbono(v)},corregir(v){formCorregir(v)},
  delDeuda(v){pregunta("¿Eliminar esta deuda? Los abonos quedan en Movimientos.","Eliminar deuda",()=>{Store.list("rec").filter(r=>r.deudaId===v).forEach(r=>Store.del(r.id));Store.del(v);toast("Deuda eliminada")})},
  estr(v){saveCfg({estrategia:v});render()},sub(v){V.sub=v||null;window.scrollTo(0,0);render()},mes(v){const[y,m]=V.mes.split("-").map(Number);const d=new Date(y,m-1+ +v,1);V.mes=iso(d).slice(0,7);render()},
  limite(c){const l=Store.cfg.limites[c];sheet(`Límite de ${c} al mes`,montoIn(l),{ok:"Guardar límite",onOk:f=>{const n=toCents(f.monto),L={...Store.cfg.limites};if(n>0)L[c]=n;else delete L[c];saveCfg({limites:L});toast("Límite guardado")}})},
  nuevaMeta(){formMeta()},meta(v){verMeta(v)},editMeta(v){formMeta(Store.items[v])},delMeta(v){Store.del(v);closeSheet();render();toast("Meta eliminada")},importar(){formImport()},
  guardaCats(){const L=id=>[...new Set($(id).value.split(",").map(x=>x.trim()).filter(Boolean))];const g=L("#a-g"),i=L("#a-i");if(!g.length||!i.length)return toast("Deja al menos una categoría de cada tipo");if(!g.includes("Otro"))g.push("Otro");saveCfg({catGasto:g,catIngreso:i});toast("Categorías guardadas")},
  exportCSV(){bajar("cuentas-claras-movimientos.csv","﻿Fecha,Tipo,Concepto,Categoria,Quien,Monto\n"+movs().map(m=>[m.fecha,m.tipo,m.concepto,m.categoria,QUIEN[m.quien],(m.monto/100).toFixed(2)].map(celda).join(",")).join("\n"),"text/csv")},
  exportJSON(){bajar("cuentas-claras-respaldo.json",JSON.stringify(Store.items,null,1),"application/json")},
  limpiar(){pregunta("¿Borrar los ejemplos y empezar en blanco?","Empezar en blanco",()=>{Object.keys(Store.items).forEach(k=>delete Store.items[k]);lsSet("cc_demo",false);Store.save();toast("Listo, empieza con tu primer movimiento")})},
  cerrar(){closeSheet()},copiarLink(){const u=location.origin+location.pathname+"#unir="+V.codigo;const ver=()=>sheet("Enlace para Gabriel",`<input id="lnk" readonly value="${esc(u)}">`);try{navigator.clipboard.writeText(u).then(()=>toast("Enlace copiado"),ver)}catch{ver()}}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;e.preventDefault();A[b.dataset.a]?.(b.dataset.v)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.addEventListener("input",e=>{if(e.target.id==="q"){V.filtro.q=e.target.value;pintaMovs()}});
document.addEventListener("change",e=>{const t=e.target,id=t.id;
  if(id==="fm"){V.filtro.mes=t.value;pintaMovs()} if(id==="fd"){V.filtro.desde=t.value;pintaMovs()} if(id==="fh"){V.filtro.hasta=t.value;pintaMovs()}
  if(id==="a-sem"){saveCfg({inicioSemana:+t.value});toast("Guardado")}
  if(id==="d-extra"){const c=toCents(t.value||0);if(c>=0){saveCfg({extra:c});render()}}});

/* ---------- automatic device access ---------- */
function avisoView(msg){$("#app").innerHTML=`<div class="auth"><h1>Cuentas Claras</h1><p class="err">${esc(msg)}</p><button class="btn p" onclick="location.reload()">Intentar de nuevo</button></div>`}
const codigoEnLink=()=>{const m=location.hash.match(/^#unir=([A-Za-z0-9]+)$/);return m?m[1]:null};
async function entrar(session){const sel=()=>Store.sb.from("miembros").select("hogar_id,hogares(codigo)").eq("user_id",session.user.id).maybeSingle();
  let{data,error}=await sel();const cod=codigoEnLink();
  if(error&&!lsGet("cc_hogar",null)){avisoView("No se pudo conectar. Revisa tu internet.");return}
  if(!error&&(cod||!data)){const r=cod?await Store.sb.rpc("unirse_hogar",{p_codigo:cod,p_nombre:"Dispositivo"}):await Store.sb.rpc("crear_hogar",{p_nombre:"Dispositivo"});
    if(cod)history.replaceState(null,"",location.pathname+location.search);
    if(r.error){if(!data){avisoView(r.error.message);return}toast(r.error.message)}else({data,error}=await sel())}
  Store.hogar=data?.hogar_id||lsGet("cc_hogar",null);V.codigo=data?.hogares?.codigo||lsGet("cc_codigo","");lsSet("cc_hogar",Store.hogar);lsSet("cc_codigo",V.codigo);
  Store.open();shell();render();try{await Store.pull();Store.live();Store.flush()}catch{toast("Sin conexión. Se sincroniza al volver.")}
  addEventListener("online",()=>{Store.flush();Store.pull().catch(()=>{})});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)Store.pull().catch(()=>{})})}
async function boot(){const c=window.CC_CONFIG;
  if(c&&c.url&&c.key){
    Store.sb=window.supabase.createClient(c.url,c.key);let{data}=await Store.sb.auth.getSession();
    if(!data.session){const r=await Store.sb.auth.signInAnonymously();if(r.error){avisoView(/anonymous/i.test(r.error.message)?"Falta activar el acceso en Supabase: Authentication > Sign In / Providers > Allow anonymous sign-ins.":"No se pudo conectar. Revisa tu internet.");return}data=r.data}
    entrar(data.session);return}
  Store.open();if(!Object.keys(Store.items).length&&lsGet("cc_demo",null)===null){lsSet("cc_demo",true);ejemplos()}shell();render()}
window.CC={pagosDelMes,V,datosPeriodo,simular,saldoDeuda,saldoPersona,nextDate,ocurrencias,parseCSV,parseFecha,columnasCSV,leerFilasCSV,toCents,weekStart,datosSemana,Store,CFG0};
boot();
</script>
